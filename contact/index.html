<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Contact | Cyberal Solutions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/style.min.css">
  <link rel="stylesheet" href="../css/custom.min.css">
  <script src="/js/include-partials.js" defer></script>
</head>
<body>
  <div data-include="/partials/header.html"></div>
  <main class="container mx-auto py-12">
    <h1>Contact</h1>
    <p>Tell us about your business and we will respond quickly with next steps.</p>
    <div class="grid md:grid-cols-2 gap-8 mt-6">
      <div>
        <h3>Contact Details</h3>
        <p class="text-sm text-muted">Beverly, Ohio</p>
        <p class="text-sm text-muted">Phone: +740-538-3553</p>
        <p class="text-sm text-muted">Email: info@cyberalsolutions.com</p>
      </div>
      <form class="space-y-4" method="post" action="#" aria-label="Contact form">
        <div>
          <label for="name" class="sr-only">Your Name</label>
          <input id="name" name="name" type="text" placeholder="Your Name" class="input w-full" />
        </div>
        <div>
          <label for="email" class="sr-only">Your Email</label>
          <input id="email" name="email" type="email" placeholder="Your Email" class="input w-full" />
        </div>
        <div>
          <label for="subject" class="sr-only">Subject</label>
          <input id="subject" name="subject" type="text" placeholder="Subject" class="input w-full" />
        </div>
        <div>
          <label for="message" class="sr-only">Message</label>
          <textarea id="message" name="message" rows="6" placeholder="Message" class="textarea w-full"></textarea>
        </div>
        <div>
          <button type="submit" class="btn btn-primary w-full">Send Message</button>
        </div>
      </form>
    </div>
  </main>
  <div data-include="/partials/footer.html"></div>
</body>
</html>
