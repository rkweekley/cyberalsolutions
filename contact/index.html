<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <title>Contact | Cyberal Solutions</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../plugins/themify-icons/themify-icons.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="../css/style.min.css">
  <link rel="stylesheet" href="../css/custom.min.css">
  <script src="/js/include-partials.js" defer></script>
</head>
<body>
  <div data-include="/partials/header.html"></div>
  <main>
    <section id="contact" class="contact-us section-bg">
      <div class="container pb-5">
        <div class="grid gap-6">
          <div class="col-span-full">
            <div class="title text-center wow fadeIn">
              <h1>Contact <span class="text-primary">Us</span></h1>
              <div class="border-meghna"></div>
              <p class="mt-4 text-muted">Tell us about your business and we will respond quickly with next steps.</p>
            </div>
          </div>
          <div class="contact-info wow fadeInUp" data-wow-duration="500ms">
            <h3>Contact Details</h3>
            <div class="contact-details">
              <div class="con-info clearfix"><i class="ti-location-pin"></i><span>Beverly, Ohio</span></div>
              <div class="con-info clearfix"><i class="ti-mobile"></i><span>Phone: +740-538-3553</span></div>
              <div class="con-info clearfix"><i class="ti-email"></i><span>Email: info@cyberalsolutions.com</span></div>
            </div>
          </div>
          <div class="wow fadeInUp" data-wow-duration="500ms" data-wow-delay="300ms">
            <form class="space-y-4" method="post" action="#" aria-label="Contact form">
              <div>
                <label for="name" class="sr-only">Your Name</label>
                <input id="name" name="name" type="text" placeholder="Your Name" class="input input-bordered w-full" />
              </div>
              <div>
                <label for="email" class="sr-only">Your Email</label>
                <input id="email" name="email" type="email" placeholder="Your Email" class="input input-bordered w-full" />
              </div>
              <div>
                <label for="subject" class="sr-only">Subject</label>
                <input id="subject" name="subject" type="text" placeholder="Subject" class="input input-bordered w-full" />
              </div>
              <div>
                <label for="message" class="sr-only">Message</label>
                <textarea id="message" name="message" rows="6" placeholder="Message" class="textarea textarea-bordered w-full"></textarea>
              </div>
              <div>
                <button type="submit" class="btn btn-primary w-full">Send Message</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
  <div data-include="/partials/footer.html"></div>
</body>
</html>
